name: Publish to NPM and GPR

on:
    release:
        types: [published]
    workflow_dispatch: # run this workflow manually from Actions tab

permissions:
    contents: read
    packages: write

jobs:
    # build must pass
    build:
        runs-on: ubuntu-latest
        # if: contains(github.event.head_commit.message, '[publish]')
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npm ci
            - run: npm run build
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist

    # publish to npm
    publish-npm:
        needs: build
        runs-on: ubuntu-latest
        if: contains(github.event.head_commit.message, '[publish]')
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org/
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{secrets.PUBLISH_NPM_TOKEN}}

    # publish to gpr
    publish-gpr:
        needs: build
        runs-on: ubuntu-latest
        if: contains(github.event.head_commit.message, '[publish]')
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://npm.pkg.github.com/
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{secrets.PUBLISH_GITHUB_TOKEN}}
